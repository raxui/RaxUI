name: CI

on:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 8 and 9 build the CLI's older targets and run the generated .NET 8/9 test apps (ADR 009).
      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore SheenUI.slnx

      - name: Check code formatting
        run: dotnet format SheenUI.slnx --verify-no-changes
        if: runner.os == 'Linux'

      - name: Build solution
        run: dotnet build SheenUI.slnx -c Release --no-restore

      - name: Run tests
        shell: pwsh
        run: |
          ./tests/SheenUI.Integration.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test SheenUI.slnx -c Release --no-build --verbosity normal

      - name: Pack CLI tool
        run: dotnet pack src/SheenUI.Cli/SheenUI.Cli.csproj -c Release --no-build

  react:
    name: React (${{ matrix.os }}, create-vite ${{ matrix.create-vite }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Vite 6, 7, and 8 (ADR 010)
        create-vite: ['6.5.0', '7.1.3', '9.3.1']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Component, theme, registry, and CLI tests
        run: npm test

      - name: React CLI crash/restart recovery
        run: npm run test:recovery

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Acceptance test in a new Vite app
        env:
          CREATE_VITE_VERSION: ${{ matrix.create-vite }}
        run: npm run test:acceptance

  nextjs:
    name: Next.js (${{ matrix.os }}, create-next-app ${{ matrix.create-next-app }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Next.js 15 and 16, App Router, no Tailwind (ADR 011)
        create-next-app: ['15.5.28', '16.4.3']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Acceptance test in a new Next.js app
        env:
          CREATE_NEXT_APP_VERSION: ${{ matrix.create-next-app }}
        run: npm run test:acceptance:next
