name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore BlazorUI.slnx

      - name: Check code formatting
        run: dotnet format BlazorUI.slnx --verify-no-changes
        if: runner.os == 'Linux'

      - name: Build solution
        run: dotnet build BlazorUI.slnx -c Release --no-restore

      - name: Run tests
        shell: pwsh
        run: |
          ./tests/BlazorUI.Integration.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test BlazorUI.slnx -c Release --no-build --verbosity normal

      - name: Pack CLI tool
        run: dotnet pack src/BlazorUI.Cli/BlazorUI.Cli.csproj -c Release --no-build

  react:
    name: React (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Component, theme, registry, and CLI tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Acceptance test in a new Vite app
        run: npm run test:acceptance
