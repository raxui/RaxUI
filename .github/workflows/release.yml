name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Explicitly publish the selected v* tag to NuGet and GitHub Releases'
        type: boolean
        default: false

jobs:
  release:
    if: ${{ inputs.publish }}
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Require a version tag
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "Select an existing v* tag. Publishing from a branch is not supported."
            exit 1
          fi

      - name: Check publishing credentials
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "Set the repository NUGET_API_KEY secret before publishing."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Read version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Restore dependencies
        run: dotnet restore SheenUI.slnx

      - name: Build solution
        run: dotnet build SheenUI.slnx -c Release --no-restore -p:Version=$VERSION

      - name: Run tests
        shell: pwsh
        run: |
          ./tests/SheenUI.Integration.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test SheenUI.slnx -c Release --no-build

      - name: Pack CLI
        run: dotnet pack src/SheenUI.Cli/SheenUI.Cli.csproj -c Release --no-build -p:Version=$VERSION -o ./nupkg

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "Set the repository NUGET_API_KEY secret before publishing."
            exit 1
          fi
          dotnet nuget push './nupkg/*.nupkg' --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./nupkg/*.nupkg
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
