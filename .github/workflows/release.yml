name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Explicitly publish the selected v* tag to NuGet, npm and GitHub Releases'
        type: boolean
        default: false

jobs:
  release:
    if: ${{ inputs.publish }}
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Require a version tag
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "Select an existing v* tag. Publishing from a branch is not supported."
            exit 1
          fi

      - name: Check publishing credentials
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NUGET_API_KEY" ] || [ -z "$NPM_TOKEN" ]; then
            echo "Set the repository NUGET_API_KEY and NPM_TOKEN secrets before publishing."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Read version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Both CLIs carry the tag's version, which is also their registry release identity.
      - name: Check React CLI version
        run: |
          REACT_VERSION=$(node -p "require('./src/react-cli/package.json').version")
          if [ "$REACT_VERSION" != "$VERSION" ]; then
            echo "src/react-cli/package.json is $REACT_VERSION; set it to $VERSION before tagging."
            exit 1
          fi

      - name: Restore dependencies
        run: dotnet restore RaxUI.slnx

      - name: Build solution
        run: dotnet build RaxUI.slnx -c Release --no-restore -p:Version=$VERSION

      - name: Run tests
        shell: pwsh
        run: |
          ./tests/RaxUI.Integration.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test RaxUI.slnx -c Release --no-build

      - name: Test React library
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Pack CLI
        run: dotnet pack src/RaxUI.Cli/RaxUI.Cli.csproj -c Release --no-build -p:Version=$VERSION -o ./nupkg

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "Set the repository NUGET_API_KEY secret before publishing."
            exit 1
          fi
          dotnet nuget push './nupkg/*.nupkg' --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      # The first preview is also `latest`, so `npx @raxui/react` resolves it.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish ./src/react-cli --access public --tag latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./nupkg/*.nupkg
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
